    certification_required: false
    local_required: true
    risk_level: "high"
    notes: "Needs experience with outdoor sauna assemblies"
  - capability_id: "electrician"
    capability_type: "licensed_trade"
    required_for: "Heater power and lighting"
    description: "Licensed electrician for heater circuit, controls, and LED integration"
