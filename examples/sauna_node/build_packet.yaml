    certification_required: true
    local_required: true
    risk_level: "critical"
    notes: "Heater load and local code review required"
  - capability_id: "plumber"
    capability_type: "licensed_trade"
    required_for: "Outdoor shower and drainage tie-in"
    description: "Plumbing review for shower supply, drain routing, and freeze protection"
    licensed_trade: true
    certification_required: true
    local_required: true
    risk_level: "high"
    notes: "Confirm drain and winterization details"
  - capability_id: "stone_supplier"
    capability_type: "supplier"
    required_for: "Stone accent wall materials"
    description: "Supply heat-tolerant stone veneer system"
    licensed_trade: false
    certification_required: false
    local_required: false
    risk_level: "medium"
    notes: "Need heat and moisture compatibility"
  - capability_id: "installer"
    capability_type: "field_install"
    required_for: "Final site installation"
    description: "Coordinate assembly, waterproofing, drainage, and commissioning"
    licensed_trade: false
    certification_required: false
    local_required: true
    risk_level: "high"
    notes: "Installation sequencing matters across trades"
  - capability_id: "permit_reviewer"
    capability_type: "review"
    required_for: "Code and permit review"
    description: "Review local code, setbacks, utility, and permit implications"
    licensed_trade: false
    certification_required: false
    local_required: true
    risk_level: "critical"
    notes: "Do not route externally before local review"
